<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 250px; font-family: system-ui, sans-serif; padding: 15px; text-align: center; }
    h4 { margin-top: 0; color: #ff6740; }
    button {
      width: 100%; padding: 10px; margin: 5px 0; border: none; 
      border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;
    }
    #btnCbz { background: #3b82f6; color: white; }
    #btnPdf { background: #ef4444; color: white; }
    button:hover { filter: brightness(1.1); }
    #status { margin-top: 15px; font-size: 12px; font-weight: bold; color: #555; }
    .warning { font-size: 11px; color: #888; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h4>MangaDex Downloader</h4>
  <div class="warning">⚠️ Wajib scroll komik sampai halaman paling bawah sebelum klik tombol!</div>
  
  <button id="btnCbz">Download as .CBZ</button>
  <button id="btnPdf">Download as .PDF</button>
  
  <div id="status">Pilih format unduhan...</div>

  <script src="jszip.min.js"></script>
  <script src="jspdf.umd.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
